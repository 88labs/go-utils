services:
  elasticmq:
    image: softwaremill/elasticmq:latest
    container_name: go_utils_elasticmq
    ports:
      - "29324:29324"
      - "29325:29325"
    volumes:
      - ./docker/sqs_elasticmq/opt/elasticmq.conf:/opt/elasticmq.conf:ro
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: go_utils_rustfs_ci
    ports:
      - "29000:9000"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_REGION=ap-northeast-1
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=false
      - RUSTFS_ACCESS_KEY=DUMMYACCESSKEYEXAMPLE
      - RUSTFS_SECRET_KEY=DUMMYSECRETKEYEXAMPLE
      - RUSTFS_OBS_LOGGER_LEVEL=warn
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
  rustfscreatebuckets:
    image: amazon/aws-cli:2
    container_name: go_utils_rustfs_init_ci
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=DUMMYACCESSKEYEXAMPLE
      - AWS_SECRET_ACCESS_KEY=DUMMYSECRETKEYEXAMPLE
      - AWS_DEFAULT_REGION=ap-northeast-1
      - AWS_EC2_METADATA_DISABLED=true
    entrypoint: >
      /bin/sh -c "
      set -e;
      aws configure set default.s3.addressing_style path;
      aws s3api create-bucket --bucket test --create-bucket-configuration LocationConstraint=ap-northeast-1 --endpoint-url http://rustfs:9000;
      aws s3api put-bucket-policy --bucket test --policy file:///policies/policy_test.json --endpoint-url http://rustfs:9000;
      "
    volumes:
      - ./docker/rustfs/policies:/policies:ro
  dynamodb:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data -port 28002"
    image: "amazon/dynamodb-local:latest"
    container_name: go_utils_dynamodb_ci
    ports:
      - "28002:28002"
    volumes:
      - "./docker/dynamodb/data:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
  dynamodbcreatetable:
    image: "amazon/aws-cli"
    container_name: go_utils_dynamodb_ci_init
    environment:
      - AWS_ACCESS_KEY_ID=DUMMYACCESSKEYEXAMPLE
      - AWS_SECRET_ACCESS_KEY=DUMMYSECRETKEYEXAMPLE
      - AWS_DEFAULT_REGION=ap-northeast-1
    depends_on:
      - dynamodb
    entrypoint: >
      /bin/sh -c '
      until (aws dynamodb list-tables --endpoint-url http://dynamodb:28002 --output text) do echo '...waiting...' && sleep 1; done;
      aws dynamodb create-table --cli-input-json file:///test_tables/table_test.json --endpoint-url http://dynamodb:28002;
      until (aws dynamodb describe-table --table-name test --endpoint-url http://dynamodb:28002 --output text) do echo '...waiting...' && sleep 1; done;
      '
    volumes:
      - ./docker/dynamodb:/test_tables

volumes:
  rustfs-data:
  rustfs-logs:
