services:
  elasticmq:
    image: softwaremill/elasticmq:latest
    container_name: go_utils_elasticmq
    ports:
      - "29324:29324"
      - "29325:29325"
    volumes:
      - ./docker/sqs_elasticmq/opt/elasticmq.conf:/opt/elasticmq.conf:ro
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: go_utils_rustfs_ci
    ports:
      - "29000:9000"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_REGION=ap-northeast-1
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=false
      - RUSTFS_ACCESS_KEY=DUMMYACCESSKEYEXAMPLE
      - RUSTFS_SECRET_KEY=DUMMYSECRETKEYEXAMPLE
      - RUSTFS_OBS_LOGGER_LEVEL=warn
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
  rustfscreatebuckets:
    image: amazon/aws-cli:2.38.6
    container_name: go_utils_rustfs_init_ci
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=DUMMYACCESSKEYEXAMPLE
      - AWS_SECRET_ACCESS_KEY=DUMMYSECRETKEYEXAMPLE
      - AWS_DEFAULT_REGION=ap-northeast-1
      - AWS_EC2_METADATA_DISABLED=true
    entrypoint: >
      /bin/sh -c "
      set -e;
      aws configure set default.s3.addressing_style path;
      aws s3api create-bucket --bucket test --create-bucket-configuration LocationConstraint=ap-northeast-1 --endpoint-url http://rustfs:9000;
      aws s3api put-bucket-policy --bucket test --policy file:///policies/policy_test.json --endpoint-url http://rustfs:9000;
      "
    volumes:
      - ./docker/rustfs/policies:/policies:ro
  dynamodb:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data -port 28002"
    image: "amazon/dynamodb-local:latest"
    container_name: go_utils_dynamodb_ci
    ports:
      - "28002:28002"
    volumes:
      - "./docker/dynamodb/data:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
  dynamodbcreatetable:
    image: "amazon/aws-cli"
    container_name: go_utils_dynamodb_ci_init
    environment:
      - AWS_ACCESS_KEY_ID=DUMMYACCESSKEYEXAMPLE
      - AWS_SECRET_ACCESS_KEY=DUMMYSECRETKEYEXAMPLE
      - AWS_DEFAULT_REGION=ap-northeast-1
    depends_on:
      - dynamodb
    entrypoint: >
      /bin/sh -c '
      until (aws dynamodb list-tables --endpoint-url http://dynamodb:28002 --output text) do echo '...waiting...' && sleep 1; done;
      aws dynamodb create-table --cli-input-json file:///test_tables/table_test.json --endpoint-url http://dynamodb:28002;
      until (aws dynamodb describe-table --table-name test --endpoint-url http://dynamodb:28002 --output text) do echo '...waiting...' && sleep 1; done;
      '
    volumes:
      - ./docker/dynamodb:/test_tables

  # ---- cdc integration test stack (profile "cdc") -------------------------
  # docker compose --profile cdc up -d mysql floci flocisetup debezium
  # Kept behind a profile so `docker compose up -d` (task test-aws) does not
  # start it. Flow: mysql binlog -> debezium -> sns -> sqs (floci) -> cdc consumer.
  mysql:
    profiles: ["cdc"]
    image: mysql:8.4
    container_name: go_utils_cdc_mysql
    command: ["--default-time-zone=+00:00"]
    ports:
      - "23306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
  floci:
    profiles: ["cdc"]
    image: floci/floci:latest
    container_name: go_utils_cdc_floci
    ports:
      # Not 4566, so it does not clash with a floci/LocalStack already running locally.
      - "24566:4566"
  flocisetup:
    profiles: ["cdc"]
    image: amazon/aws-cli:2.38.6
    container_name: go_utils_cdc_floci_init
    depends_on:
      - floci
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-northeast-1
      - AWS_EC2_METADATA_DISABLED=true
      - AWS_PAGER=
      - AWS_ENDPOINT_URL=http://floci:4566
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./docker/floci:/init:ro
  debezium:
    profiles: ["cdc"]
    image: quay.io/debezium/server:nightly
    container_name: go_utils_cdc_debezium
    depends_on:
      mysql:
        condition: service_healthy
      flocisetup:
        condition: service_completed_successfully
    volumes:
      - debezium-data:/debezium/data
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-northeast-1
      DEBEZIUM_SOURCE_CONNECTOR_CLASS: io.debezium.connector.mysql.MySqlConnector
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: mysql
      DEBEZIUM_SOURCE_DATABASE_PORT: "3306"
      DEBEZIUM_SOURCE_DATABASE_USER: root
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: root
      DEBEZIUM_SOURCE_DATABASE_SERVER_ID: 184055
      DEBEZIUM_SOURCE_TOPIC_PREFIX: cdc
      DEBEZIUM_SOURCE_DATABASE_INCLUDE_LIST: cdc_source
      DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST: cdc_source.orders
      DEBEZIUM_SOURCE_INCLUDE_SCHEMA_CHANGES: "false"
      DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME: /debezium/data/offsets.dat
      DEBEZIUM_SOURCE_SCHEMA_HISTORY_INTERNAL: io.debezium.storage.file.history.FileSchemaHistory
      DEBEZIUM_SOURCE_SCHEMA_HISTORY_INTERNAL_FILE_FILENAME: /debezium/data/schema-history.dat
      # mysqlsink needs the schema block to type columns.
      DEBEZIUM_FORMAT_VALUE: json
      DEBEZIUM_FORMAT_VALUE_SCHEMAS_ENABLE: "true"
      DEBEZIUM_SINK_TYPE: sns
      DEBEZIUM_SINK_SNS_REGION: ap-northeast-1
      DEBEZIUM_SINK_SNS_ENDPOINT: http://floci:4566
      DEBEZIUM_SINK_SNS_TOPIC_ARN_PREFIX: "arn:aws:sns:ap-northeast-1:000000000000:"

volumes:
  rustfs-data:
  rustfs-logs:
  debezium-data:
