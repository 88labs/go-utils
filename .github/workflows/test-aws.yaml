name: Test AWS

on:
  push:
    branches:
      - main
    paths:
      - "aws/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "aws/**"
env:
  testdir : ./aws

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: [ 1.26.x ]
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    services:
      rustfs:
        image: rustfs/rustfs:1.0.0
        ports:
          - 29000:9000
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_REGION: ap-northeast-1
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_ACCESS_KEY: DUMMYACCESSKEYEXAMPLE
          RUSTFS_SECRET_KEY: DUMMYSECRETKEYEXAMPLE
          RUSTFS_OBS_LOGGER_LEVEL: warn
      elasticmq:
        image: softwaremill/elasticmq:latest
        ports:
          - 29324:9324
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 28002:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            ${{ env.testdir }}/go.sum
      - name: Setup gotestsum
        uses: autero1/action-gotestsum@7263b9d73912eec65f46337689e59fac865c425f # v2.0.0
        with:
          gotestsum_version: 1.12.0
      - name: Download Go modules
        working-directory: ${{ env.testdir }}
        shell: bash
        run: go mod download
      - name: Migrate DynamoDB
        timeout-minutes: 1
        working-directory: ${{ env.testdir }}
        env:
          AWS_ACCESS_KEY_ID: DUMMYACCESSKEYEXAMPLE
          AWS_SECRET_ACCESS_KEY: DUMMYSECRETKEYEXAMPLE
          AWS_DEFAULT_REGION: ap-northeast-1
          AWS_EC2_METADATA_DISABLED: true
          AWS_PAGER: ""
        shell: bash
        run: |
          echo "Waiting for DynamoDB to be ready..."
          until aws dynamodb list-tables --endpoint-url http://127.0.0.1:28002 --output text; do
            echo '...waiting...'
            sleep 2
          done

          echo "DynamoDB is ready. Creating table..."
          aws dynamodb create-table \
            --cli-input-json file://${{ github.workspace }}/aws/docker/dynamodb/table_test.json \
            --endpoint-url http://127.0.0.1:28002

          echo "Waiting for table creation..."
          until aws dynamodb describe-table --table-name test --endpoint-url http://127.0.0.1:28002 --output text; do
            echo '...waiting...'
            sleep 1
          done
      - name: Migrate RustFS
        timeout-minutes: 1
        working-directory: ${{ env.testdir }}
        env:
          AWS_ACCESS_KEY_ID: DUMMYACCESSKEYEXAMPLE
          AWS_SECRET_ACCESS_KEY: DUMMYSECRETKEYEXAMPLE
          AWS_DEFAULT_REGION: ap-northeast-1
          AWS_EC2_METADATA_DISABLED: true
          AWS_PAGER: ""
        shell: bash
        run: |
          echo "Waiting for RustFS to be ready..."
          aws configure set default.s3.addressing_style path
          until aws s3api list-buckets --endpoint-url http://127.0.0.1:29000 --output text; do
            echo '...waiting...'
            sleep 2
          done

          echo "RustFS is ready. Creating bucket..."
          aws s3api create-bucket \
            --bucket test \
            --create-bucket-configuration LocationConstraint=ap-northeast-1 \
            --endpoint-url http://127.0.0.1:29000
          aws s3api put-bucket-policy \
            --bucket test \
            --policy file://${{ github.workspace }}/aws/docker/rustfs/policies/policy_test.json \
            --endpoint-url http://127.0.0.1:29000
      - name: Migrate ElasticMQ
        timeout-minutes: 1
        working-directory: ${{ env.testdir }}
        env:
          AWS_ACCESS_KEY_ID: DUMMYACCESSKEYEXAMPLE
          AWS_SECRET_ACCESS_KEY: DUMMYSECRETKEYEXAMPLE
          AWS_DEFAULT_REGION: ap-northeast-1
          AWS_EC2_METADATA_DISABLED: true
          AWS_PAGER: ""
        shell: bash
        run: |
          echo "Waiting for ElasticMQ to be ready..."
          until aws sqs list-queues --endpoint-url http://127.0.0.1:29324 --output json >/dev/null 2>&1; do
            echo '...waiting...'
            sleep 2
          done

          echo "ElasticMQ is ready. Creating queues..."
          for queue in test-queue test-2-queue; do
            aws sqs create-queue \
              --queue-name "${queue}" \
              --attributes VisibilityTimeout=10,ReceiveMessageWaitTimeSeconds=0 \
              --endpoint-url http://127.0.0.1:29324 \
              --output json >/dev/null
          done
      - name: Test
        working-directory: ${{ env.testdir }}
        run: |
          gotestsum --format testname --junitfile unit-tests.xml -- ./... -p 4 -race -coverprofile="coverage.txt" -covermode=atomic -coverpkg=./...
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./unit-tests.xml,./coverage.txt
